name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CUENTICA_API_KEY: ''
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', stable]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run just fmt to format:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Check dependencies
        run: go mod verify
      - name: Run static checks
        run: go vet ./...
      - name: Run tests
        run: go test -count=1 -timeout=5m ./...
      - name: Test build tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native binary
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/build build
          else
            ./scripts/build build
          fi
      - name: Check binary help and version
        run: |
          binary=./bin/cuentica
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          "$binary" --version
          "$binary" --help > /dev/null

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Run race detector
        run: go test -race -count=1 -timeout=5m ./...
